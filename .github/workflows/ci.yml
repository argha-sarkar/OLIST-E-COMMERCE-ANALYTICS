name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint SQL files exist and are non-empty
        run: |
          for f in sql/*.sql; do test -s "$f" || (echo "empty SQL: $f" && exit 1); done

      - name: Run tests (csv mode, no database needed)
        env:
          DATA_SOURCE: csv
        run: python -m pytest -q --maxfail=1

      - name: Smoke-run the pipeline on fixture data
        env:
          DATA_SOURCE: csv
          OLIST_RAW_DIR: tests/fixtures/raw
          OLIST_REPORTS_DIR: reports_ci
        run: python -m src.pipeline --stage analyze
